<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma surpresa ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff758c,#ff7eb3,#c471ed);color:white;text-align:center}
.card{width:min(90%,650px);padding:45px 30px;border-radius:30px;background:rgba(255,255,255,.15);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25);position:relative;z-index:2}
.heart{font-size:64px;animation:pulse 1.2s infinite}
h1{font-size:clamp(32px,7vw,64px);margin:15px 0;text-shadow:0 4px 15px rgba(0,0,0,.25)}
p{font-size:20px;line-height:1.5}
button{border:0;border-radius:999px;padding:16px 30px;font-size:18px;font-weight:bold;cursor:pointer;color:#d6336c;background:white;box-shadow:0 8px 25px rgba(0,0,0,.2);transition:.25s}
button:hover{transform:scale(1.06)}
#surpresa{display:none}
.float{position:fixed;bottom:-50px;font-size:28px;animation:subir linear forwards;opacity:.8}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes subir{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.fade{animation:fade .8s ease}
@keyframes fade{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="card" id="inicio">
<div class="heart">💌</div>
<h1>Tenho uma coisa pra você...</h1>
<p>Prometo que vale a pena clicar nesse botão. 👀</p>
<button onclick="revelar()">Abrir minha surpresa ❤️</button>
</div>

<div class="card fade" id="surpresa">
<div class="heart">❤️</div>
<h1>EU TE AMO, FEDORENTA! 😂❤️</h1>
<p>Você é muito especial pra mim.<br>E mesmo sendo essa fedorenta que eu amo,<br>eu não trocaria você por nada. 🥹❤️</p>
<p><strong>Com amor, seu namorado. ❤️</strong></p>
</div>

<script>
function revelar(){
document.getElementById("inicio").style.display="none";
document.getElementById("surpresa").style.display="block";
for(let i=0;i<35;i++) setTimeout(criarCoracao,i*100);
}
function criarCoracao(){
const e=document.createElement("div");
e.className="float";
e.textContent=["❤️","💕","💖","💗","💘"][Math.floor(Math.random()*5)];
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),8500);
}
</script>
</body>
</html>
